# Same idea as the Python version's database.py: fall back to a local,
# zero-setup database (H2 file here, SQLite there), and read a real
# Postgres connection from the environment in production.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./students-db}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# "update" creates/extends tables automatically - fine for a teaching demo,
# a real project would use a migration tool (e.g. Flyway) instead.
spring.jpa.hibernate.ddl-auto=update

# Most hosts (Render included) tell the app which port to listen on via $PORT.
server.port=${PORT:8080}

# Swagger UI ends up at /swagger-ui.html ; raw schema at /v3/api-docs
springdoc.swagger-ui.path=/docs
